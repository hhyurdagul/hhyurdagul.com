<template id="electricity-demo">
<style>

/* Always light: white surfaces, one amber accent for TimesFM, teal for the

}

*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:is(button, a, summary, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

p { margin: 0; }
h1, h2, h3, h4 { margin: 0; }

/* The card: overflow is clipped, not scrolled, so the sticky progress and nav

.app {
  overflow: clip;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--page);
  color: var(--text);

}
.wrap { width: 100%; max-width: var(--col); margin-inline: auto; padding-inline: 20px; }

/* ------------------------------------------------------------ header */

.top { background: var(--card); border-bottom: 1px solid var(--border); }
.picker { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-items: center; padding-block: 12px; }
.picker-k { color: var(--muted); font-size: 12px; font-weight: 600; }

.blurb { grid-column: 2; color: var(--muted); font-size: 12.5px; }

/* The picker scrolls away; only the step progress stays pinned. */
.progress { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--border); }

/* ------------------------------------------------------------ main */

/* score */

    <div class="wrap picker">
      <span class="picker-k" id="groups-k">Day type</span>

<script>
(() => {
"use strict";

const host = document.querySelector("electricity-demo");
const template = document.getElementById("electricity-demo");
if (!host || !template || !host.attachShadow) return;
const root = host.attachShadow({ mode: "open" });
root.append(template.content.cloneNode(true));

/* ------------------------------------------------------------------ data */

const CONTEXT = 1024;  // hours of demand history TimesFM 2.5 sees
const PEAK = 41000;    // MWh, scale of the illustrative curves

// 24-hour MAPE from the April–June 2026 rolling backtest.
const MAPE = {

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function svg(tag, attrs, ...kids) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const kid of kids) el.append(typeof kid === "string" ? document.createTextNode(kid) : kid);
  return el;
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Roughly standard normal: the sum of three uniforms, rescaled.
const gauss = (r) => (r() + r() + r() - 1.5) * 2;

function grow(fills) {

}

// Hourly shape of Turkish demand, relative to a weekday peak: a night trough,
// a late-morning peak, a lunch dip and an evening hump. Sundays sit lower and
// wake up later; Saturdays fall in between.
const WEEKDAY = [.86, .81, .78, .76, .75, .75, .77, .82, .90, .96, .99, 1, .96, .97, .99, .99, .98, .97, .96, .98, .99, .97, .93, .89];
const SUNDAY = [.84, .79, .76, .74, .72, .71, .70, .70, .72, .76, .80, .83, .84, .84, .84, .85, .86, .88, .91, .94, .95, .94, .91, .87];

function shape(s, day, hr) {
  const wd = ((s.wd + day) % 7 + 7) % 7;
  let v = wd === 6 ? SUNDAY[hr] : wd === 5 ? 0.55 * WEEKDAY[hr] + 0.45 * SUNDAY[hr] : WEEKDAY[hr];
  if (wd === 0 && hr < 9) v *= 0.97;
  if (s.holidays.includes(day)) v = SUNDAY[hr] * s.depth * (wd === 6 ? 0.97 : 1);
  else if (day === s.eve && hr >= 13) v *= 0.9;
  return v;
}

// Actual demand over the context window and the horizon, plus two stand-in
// forecasts that imitate how each method behaves. They are not model output.
function build(s) {
  const r = rng(s.seed * 7919);
  const N = CONTEXT + s.horizon;
  const O = CONTEXT;
  const day = (i) => Math.floor((i - O) / 24);
  const hour = (i) => (((i - O) % 24) + 24) % 24;
  const level = {};
  const actual = new Float64Array(N);
  let e = 0;
  for (let i = 0; i < N; i++) {
    const d = day(i);
    level[d] ??= 1 + 0.012 * Math.sin(d / 5) + 0.007 * gauss(r);
    e = 0.9 * e + 0.0045 * gauss(r);
    actual[i] = PEAK * shape(s, d, hour(i)) * level[d] * (1 + e);
  }
  // History only: the same hour of the same weekday over the last four weeks,
  // recent weeks weighted more, scaled to last week's level.
  const W = [0.4, 0.3, 0.2, 0.1];
  const mean = (a, b) => { let t = 0; for (let i = a; i < b; i++) t += actual[i]; return t / (b - a); };
  const drift = Math.sqrt(mean(O - 168, O) / mean(O - 672, O - 168));
  const tf = new Float64Array(s.horizon);
  for (let k = 0; k < s.horizon; k++) {
    let v = 0;
    for (let w = 0; w < W.length; w++) v += W[w] * actual[O + k - 168 * (w + 1)];
    tf[k] = v * drift;
  }
  // The plan: close to actual, with its own smooth error and a small bias.
  const plan = new Float64Array(s.horizon);
  const rp = rng(s.seed * 104729);
  let p = 0;
  for (let k = 0; k < s.horizon; k++) {
    p = 0.85 * p + Math.sqrt(1 - 0.85 ** 2) * s.planSd * gauss(rp);
    plan[k] = actual[O + k] * (1 + s.planBias + p);
  }
  const target = actual.slice(O);
  const mape = (f) => f.reduce((t, v, k) => t + Math.abs(target[k] - v) / target[k], 0) / f.length * 100;
  return { N, O, day, hour, actual, target, tf, plan, mapeTf: mape(tf), mapePlan: mape(plan) };
}

function sleep(ms, tk) {
  return new Promise((resolve, reject) => {
    const end = performance.now() + ms;
    (function tick() {
      if (tk !== S.token) return reject(CANCEL);
      if (S.fast || performance.now() >= end) return resolve();
      setTimeout(tick, Math.min(50, end - performance.now()));
    })();
  });
}
// Revisited steps and reduced motion render instantly.
function makeWait(tk, instant) {
  const wait = (ms) => {
    if (tk !== S.token) return Promise.reject(CANCEL);
    return instant || reduced ? Promise.resolve() : sleep(ms, tk);
  };
  wait.instant = instant || reduced;
  return wait;
}

// Keep the newest element above the pinned nav while a step the reader started
// plays, unless they have scrolled away in the meantime.
function show(el, last = el) {
  if (S.userScrolled || !el.isConnected) return;
  const top = el.getBoundingClientRect().top;
  const bottom = last.getBoundingClientRect().bottom;
  const progress = $("progress");
  const topLimit = (progress.hidden ? 0 : progress.offsetHeight) + 12;
  const bottomLimit = innerHeight - root.querySelector(".nav").offsetHeight - 12;
  if (bottom <= bottomLimit) return;
  const delta = Math.min(bottom - bottomLimit, top - topLimit);
  if (delta > 0) scrollBy({ top: delta, behavior: reduced || S.fast ? "auto" : "smooth" });
}

// A new step starts at the top of the stage; if the reader has scrolled past

// Charts are drawn at the card's real width so labels keep their size on
// narrow screens; the viewBox matches the pixels.
function innerW(el) {
  const cs = getComputedStyle(el);
  return Math.max(260, Math.floor(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
}

function chart({ w, ht = 210, x0, x1, y0, y1, pad = {}, yTicks = [], label }) {
  const p = { l: yTicks.length ? 50 : 8, r: 8, t: 14, b: 22, ...pad };
  const X = (x) => p.l + ((x - x0) / (x1 - x0)) * (w - p.l - p.r);
  const Y = (y) => p.t + (1 - (y - y0) / (y1 - y0)) * (ht - p.t - p.b);
  const el = svg("svg", { class: "chart", viewBox: `0 0 ${w} ${ht}`, width: w, height: ht, role: "img", "aria-label": label });
  const back = svg("g");
  const grid = svg("g");
  const front = svg("g");
  el.append(back, grid, front);
  for (const v of yTicks) {
    grid.append(svg("line", { class: "grid", x1: p.l, x2: w - p.r, y1: Y(v).toFixed(1), y2: Y(v).toFixed(1) }));
    const top = v === yTicks.at(-1);
    grid.append(svg("text", { x: p.l - 6, y: (Y(v) + 4).toFixed(1), "text-anchor": "end" }, `${Math.round(v / 1000)}${top ? " GWh" : ""}`));
  }
  const line = (xs, vs, cls) => svg("path", { class: `ln ${cls}`, pathLength: 1,
    d: Array.from(vs, (v, k) => `${k ? "L" : "M"}${X(xs(k)).toFixed(1)},${Y(v).toFixed(1)}`).join("") });
  const text = (x, y, str, attrs = {}) => svg("text", { x: x.toFixed(1), y: y.toFixed(1), ...attrs }, str);
  return { el, X, Y, p, w, ht, back, grid, front, line, text };
}

// Draw a path in, or show it at once on revisits and with reduced motion.
function draw(path, wait, secs = 1.4) {
  path.classList.add("draw");
  path.style.setProperty("--t", wait.instant ? "0s" : `${secs}s`);
  requestAnimationFrame(() => requestAnimationFrame(() => path.classList.add("on")));
}
function fadeIn(el, wait) {
  el.classList.add("fade");
  if (wait.instant) el.style.transition = "none";
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
}

// Shade holiday days that fall inside [x0, x1] (hours relative to the origin).
function shadeHolidays(c, s, x0, x1, labels = true) {
  const days = [...s.holidays.map((d) => [d, "Holiday"]), ...(s.eve != null ? [[s.eve, "Eve"]] : [])];
  for (const [d, kind] of days) {
    const a = Math.max(x0, d * 24 + (kind === "Eve" ? 13 : 0));
    const b = Math.min(x1, d * 24 + 24);
    if (b <= a) continue;
    c.back.append(svg("rect", { class: "hol", x: c.X(a).toFixed(1), y: c.p.t, width: (c.X(b) - c.X(a)).toFixed(1), height: c.ht - c.p.t - c.p.b }));
  }
  const inRange = s.holidays.filter((d) => d * 24 >= x0 && d * 24 < x1);
  if (labels && inRange.length) {
    const mid = (Math.min(...inRange) * 24 + Math.min(x1, (Math.max(...inRange) + 1) * 24)) / 2;
    c.grid.append(c.text(c.X(mid), c.p.t + 12, s.chip === "One-day holiday" ? "Holiday" : "Eid", { class: "lab hol-t", "text-anchor": "middle" }));
  }
}

const niceTicks = (lo, hi) => {

const extent = (...arrs) => {
  let lo = Infinity, hi = -Infinity;
  for (const a of arrs) for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; }
  return [lo - (hi - lo) * 0.08, hi + (hi - lo) * 0.12];
};

  c.grid.append(c.text((c.X(0) + c.X(s.horizon)) / 2, c.ht / 2, "?", { class: "q", "text-anchor": "middle" }));
  c.grid.append(c.text(c.X(x0), c.ht - 6, "two weeks ago"), c.text(c.X(0) - 4, c.ht - 6, "now", { "text-anchor": "end" }));

  $("stage").append(illus());
  return { path, run };
}

async function playIntro(tk, { path, run }) {
  const wait = makeWait(tk, false);
  await visible;
  await wait(400);
  draw(path, wait, 1.6);
  await wait(1700);
  S.ready = true;
  run.classList.add("pulse");
  autoAdvance();
}

function start() {
  if (S.phase !== "intro") return;
  stopCountdown();
  S.token++;
  S.phase = "pipeline";
  go(0);
}

/* ------------------------------------------------------------------ steps */

async function go(i) {
  if (S.phase !== "pipeline" || i < 0 || i > S.reached + 1 || i >= steps().length) return;
  stopCountdown();
  const tk = ++S.token;
  const seen = i <= S.reached;
  Object.assign(S, { step: i, reached: Math.max(S.reached, i), busy: true, fast: false, userScrolled: false });
  const key = steps()[i].key;
  renderProgress();
  updateNav();
  announce(`Step ${i + 1}: ${META[key].title}`);
  const stage = $("stage");
  stage.replaceChildren();
  bringIntoView();
  try {
    await RENDER[key](stage, cur(), makeWait(tk, seen));
  } catch (e) {
    if (e === CANCEL) return;
    throw e;
  }
  if (tk !== S.token) return;
  S.busy = false;
  renderProgress();
  updateNav();
  autoAdvance();
}

const head = (key) => h("div", { class: "head reveal" },
  h("p", { class: "eyebrow" }, `Step ${S.step + 1} · ${META[key].method}`),
  h("h3", { class: "t2" }, META[key].title),
  h("p", { class: "lede" }, META[key].lede));

function why(key) {
  const w = WHY[key](cur());
  return h("div", { class: "why reveal" },
    h("p", { class: "why-k" }, "Why it's built this way"),
    h("p", { class: "why-main" }, h("b", {}, w.num), h("span", {}, w.text)),
    h("details", {}, h("summary", {}, "More"), h("div", {}, w.more.map((t) => h("p", {}, t)))));
}

const mechanics = (...kids) => h("details", { class: "mech reveal" }, h("summary", {}, "Show the mechanics"), h("div", {}, kids));
const result = (tone, big, ...text) => h("div", { class: `result ${tone} reveal` }, big ? h("span", { class: "big" }, big) : null, h("span", {}, text));

// Finish a step: result line, then the design note and optional mechanics.
function finish(stage, ...parts) {
  const kept = parts.filter(Boolean);
  for (const p of kept) stage.append(p);
  // Mechanics stay folded, so the result and the design note are what must fit.
  const shown = kept.filter((p) => !p.classList.contains("mech"));
  show(shown[0], shown.at(-1));
}

// Whole weekdays inside the context window, and the partial day at its start.
function windowDays(s) {
  const counts = new Array(7).fill(0);
  const first = -Math.ceil(CONTEXT / 24);
  for (let d = first + 1; d < 0; d++) counts[((s.wd + d) % 7 + 7) % 7]++;
  return { counts, partial: CONTEXT % 24, partialDay: WD[((s.wd + first) % 7 + 7) % 7] };
}

      ["Your call", S.bet ? `${name[S.bet]}: ${S.bet === winner ? "right" : "wrong"} on this example` : "Skipped"],
      ["This example", `${name[winner]} closer. TimesFM ${fmtPct(d.mapeTf, 1)}, plan ${fmtPct(d.mapePlan, 1)} (illustrative)`],
      ["Backtest", s.type === "excl" ? "Ordinary hours: TimesFM 2.57%, plan 3.05%"
        : s.type === "hol" ? "Public holiday hours: TimesFM 11.79%, plan 3.91%"
          : "At 168 h, all hours: TimesFM 6.04%, plan 3.01%; only the first day of that plan would exist at a week-ahead origin"],
    ];
    const list = h("ol", { class: "path" });
    stage.append(h("div", { class: "card reveal" }, list));
    for (const [i, [k, v]] of rows.entries()) {
      list.append(h("li", { class: "reveal" }, h("span", {}, i + 1), h("b", {}, k), h("span", {}, v)));
      await wait(220);
    }
    await wait(400);
    const tile = (big, label) => h("div", { class: "tile" }, h("b", {}, big), h("span", {}, label));
    stage.append(h("div", { class: "card reveal" }, h("p", { class: "card-label" }, "April–June 2026 backtest · TimesFM vs EPİAŞ plan"),
      h("div", { class: "tiles" },
        tile("3.47% vs 3.13%", "24-hour MAPE, all reported hours"),
        tile("2.57% vs 3.05%", "24-hour MAPE, ordinary hours"),
        tile("11.79% vs 3.91%", "24-hour MAPE, public holiday hours"),
        tile("6.04% vs 3.01%", "168-hour MAPE; successive day-ahead plan")),
      h("p", { class: "small", style: "margin-top:10px" }, "The 168-hour plan is a retrospective reference: only its first day would exist at a week-ahead origin.")));
    await wait(400);
    const others = GROUPS.map((g) => {
      const idx = SCENARIOS.map((x, i) => [x, i]).filter(([x]) => x.group === g.id).map(([, i]) => i);
      const target = g.id === s.group ? idx[(idx.indexOf(S.sc) + 1) % idx.length] : idx[0];
      const b = h("button", { class: "pathcard", type: "button" }, h("b", {}, g.id === s.group && idx.length > 1 ? `Another “${g.label}”` : g.label), h("span", {}, g.blurb));
      b.onclick = () => select(target);
      return b;
    });
    finish(stage,
      h("div", { class: "card reveal" }, h("p", { class: "card-label" }, "Try another day"), h("div", { class: "paths" }, others)));
  },
};

function placeBet(kind) {
  if (S.bet || S.phase !== "pipeline" || steps()[S.step].key !== "compare" || S.busy) return;
  stopCountdown();
  S.bet = kind;
  renderOutcome(true);
  updateNav();
  autoAdvance();
}

function renderOutcome(animate) {
  const s = cur();
  const { stage, card, c, d, actions, hint, mask, q, actualPath } = B;
  const span = s.horizon === 24 ? "day" : "week";
  const winner = d.mapeTf < d.mapePlan ? "tf" : "plan";
  const name = { tf: "TimesFM", plan: "The EPİAŞ plan" };
  for (const b of actions.querySelectorAll("button")) {
    b.disabled = true;
    if (b.dataset.k === S.bet) b.classList.add("chosen");
  }
  hint.remove();
  q.remove();
  mask.remove();
  c.front.append(actualPath);
  draw(actualPath, { instant: !animate || reduced }, 1.2);
  // Hourly error as a share of actual: TimesFM above the line, the plan below.
  const ew = innerW(card);
  const eh = 92;
  const errMax = Math.max(...d.target.map((a, k) => Math.max(Math.abs(a - d.tf[k]), Math.abs(a - d.plan[k])) / a));
  const scale = (eh / 2 - 12) / Math.max(errMax, 0.04);
  const strip = svg("svg", { class: "chart", viewBox: `0 0 ${ew} ${eh}`, width: ew, height: eh, role: "img", "aria-label": "Hourly absolute error of each forecast" });
  const gx = 64;
  const bw = (ew - gx - 8) / s.horizon;
  strip.append(svg("line", { class: "grid", x1: gx, x2: ew - 8, y1: eh / 2, y2: eh / 2 }),
    svg("text", { x: 0, y: eh / 4 + 4 }, "TimesFM"), svg("text", { x: 0, y: (eh * 3) / 4 + 4 }, "Plan"));
  d.target.forEach((a, k) => {
    const et = Math.abs(a - d.tf[k]) / a * scale;
    const ep = Math.abs(a - d.plan[k]) / a * scale;
    const x = (gx + k * bw + bw * 0.15).toFixed(1);
    const w = Math.max(0.8, bw * 0.7).toFixed(1);
    strip.append(svg("rect", { class: "err-tf", x, y: (eh / 2 - et).toFixed(1), width: w, height: et.toFixed(1), rx: 1 }),
      svg("rect", { class: "err-plan", x, y: eh / 2, width: w, height: ep.toFixed(1), rx: 1 }));
  });
  const verdict = h("div", { class: "verdict reveal" },
    h("div", { class: `vbox tf ${winner === "tf" ? "win" : ""}` }, h("b", {}, fmtPct(d.mapeTf, 1)), h("span", {}, `TimesFM's mean error this ${span}`)),
    h("div", { class: `vbox plan ${winner === "plan" ? "win" : ""}` }, h("b", {}, fmtPct(d.mapePlan, 1)), h("span", {}, `the plan's mean error this ${span}`)));
  const errBox = h("div", { class: "reveal", style: "margin-top:14px" }, h("p", { class: "card-label", style: "margin-bottom:4px" }, "Hourly error, % of actual"), strip, verdict);
  card.insertBefore(errBox, actions.nextSibling);
  const right = S.bet === winner;
  const real = s.type === "excl"
    ? result("", "2.57%", h("b", {}, "Across the backtest, too. "), "On ordinary hours, TimesFM's 24-hour MAPE was 2.57% vs plan 3.05%, though in June alone the plan led on ordinary hours as well (TimesFM 2.70% vs plan 2.41%).")
    : s.type === "hol"
      ? result("plan", "3.91%", h("b", {}, "Across the backtest, too. "), "On public holiday hours, TimesFM's 24-hour MAPE was 11.79% vs plan 3.91%.")
      : result("plan", "3.01%", h("b", {}, "Across the whole backtest: "), "at 168 hours TimesFM's MAPE was 6.04% vs plan 3.01%, though only the first day of that plan would exist at a week-ahead origin. A post-holiday context effect is a hypothesis, not a tested cause.");
  const out = right
    ? result("ok", "✓", h("b", {}, "You called it. "), `${name[winner]} was closer on this illustrative ${span}.`)
    : result("bad", "✕", h("b", {}, "Not this time. "), `${name[winner]} was closer on this illustrative ${span}.`);
  stage.append(out, real, why("compare"));
  if (animate) show(out, stage.lastChild);
}

/* --------------------------------------------------------------- wiring */

$("next").onclick = () => { stopCountdown(); advance(); };
$("back").onclick = () => {
  stopCountdown();
  if (S.phase === "pipeline" && S.step > 0) go(S.step - 1);
};
$("auto").onchange = (e) => {
  S.auto = e.target.checked;
  if (S.auto) autoAdvance();
  else stopCountdown();
};
for (const ev of ["wheel", "touchmove"]) {
  addEventListener(ev, () => { if (S.busy) S.userScrolled = true; }, { passive: true });
}
// Arrow keys step through the demo only while focus is inside it.
host.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.composedPath()[0].closest?.("summary")) return;
  if (e.key === "ArrowRight" && !$("next").disabled) { e.preventDefault(); $("next").click(); }
  if (e.key === "ArrowLeft" && !$("back").disabled) { e.preventDefault(); $("back").click(); }
});

select(0, false);
})();
</script>
