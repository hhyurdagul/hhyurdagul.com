<script>
(() => {
"use strict";

const host = document.querySelector("floodguard-demo");
const template = document.getElementById("floodguard-demo");
if (!host || !template || !host.attachShadow) return;
const root = host.attachShadow({ mode: "open" });
root.append(template.content.cloneNode(true));

/* ------------------------------------------------------------------ data */

// Every window is 240 hourly readings: 168 h of history ending at the forecast
// origin (23:00 the day before the event), then the 72 h the forecast covers.
// The event day is leads 1–24, the window of the published 24-hour run.
const N = 240;
const O = 167;       // forecast origin: the last observed hour
const E = 168;       // event day, 00:00 = lead 1
const H = 24;        // displayed horizon

const GROUPS = [
  { id: "flood", label: "Flood event",
    blurb: "A selected event from the project's figures, replayed as one 24-hour forecast issued the night before." },
  { id: "ordinary", label: "Ordinary flow",
    blurb: "Most hours look like this. Every model scores well here, which is the problem." },
];

// Discharge (m³/s) on the event day, traced from the published figures, with
// the seq2seq line traced the same way. Everything around it is synthetic.
const SCENARIOS = [
  {
    group: "flood", chip: "Sharp peak", station: "D22A114", when: "July 2023", date: [2023, 6, 4],

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function svg(tag, attrs, ...kids) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const kid of kids) el.append(kid);
  return el;
}
function text(x, y, str, attrs = {}) {
  const t = svg("text", { x: x.toFixed(1), y: y.toFixed(1), ...attrs });
  t.textContent = str;
  return t;
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seedOf = (str) => [...str].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) | 0, 7);

/* ------------------------------------------------------------ time axis */

// Hour i of the window as a date (flood events) or a day number (ordinary weeks).
const dayOf = (i) => Math.floor((i - E) / 24);
const hourOf = (i) => (((i - E) % 24) + 24) % 24;
function dayLabel(s, i) {
  const k = dayOf(i);
  if (!s.date) return `Day ${k + 8}`;
  const d = new Date(Date.UTC(s.date[0], s.date[1], s.date[2] + k));
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
}
const stamp = (s, i) => `${dayLabel(s, i)}, ${pad2(hourOf(i))}:00`;

/* --------------------------------------------------------------- series */

// A runoff pulse: quadratic rise, exponential recession.
const pulse = (d, height, up, down) => (d < -up ? 0 : d < 0 ? height * (1 + d / up) ** 2 : height * Math.exp(-d / down));
const RIDGE_KERNEL = [0, 0.15, 0.4, 0.75, 1, 0.8, 0.55, 0.35, 0.2, 0.1];
const CACHE = new Map();

// Synthetic hourly window around the published event shape. Seasonal-naive
// repeats only pre-origin observations; Ridge is an illustrative rainfall
// response scaled to the scenario peak, not a fitted or evaluated forecast.
// Seq2seq follows the traced line on the event day and is synthetic elsewhere.
function series(s) {
  if (CACHE.has(s)) return CACHE.get(s);
  const r = rng(seedOf(s.station + s.chip));
  const ar = (k, amp) => { let n = 0; return Array.from({ length: N }, () => (n = k * n + (r() * 2 - 1) * amp)); };
  const n1 = ar(0.9, 0.05);
  const n2 = ar(0.75, 0.06);
  const baseAt = (i) => s.base * (1.08 - 0.12 * i / N) * (1 + n1[i]);
  const syntheticAt = (i) => {
    let v = baseAt(i);
    for (const [c, height, up, down] of s.bumps) v += pulse(i - c, height, up, down);
    return v;
  };
  const q = Array.from({ length: N }, (_, i) => syntheticAt(i));
  if (s.day) {
    for (let k = 0; k < 24; k++) q[E + k] = s.day[k];
    const last = s.day[23];
    for (let i = E + 24; i < N; i++) q[i] = baseAt(i) + (last - baseAt(i)) * Math.exp(-(i - E - 23) / s.tau);
  }
  const rain = new Array(N).fill(0);
  for (const [c, peak, w] of s.rain) {
    for (let d = -w; d <= w; d++) if (c + d >= 0 && c + d < N) rain[c + d] += peak * (1 - Math.abs(d) / (w + 1));
  }
  // Future rainfall as fed to the models: a smoothed copy of the showers.
  const fc = rain.map((v, i) => 0.9 * (0.25 * (rain[i - 1] ?? v) + 0.5 * v + 0.25 * (rain[i + 1] ?? v)));
  for (let i = 0; i < N; i++) if (r() < 0.05) rain[i] += 0.1 + r() * 0.5;

  // At every future lead, repeat the last observed day, never future discharge.
  const seasonalAt = (i) => q[i > O ? O - 23 + (i - O - 1) % 24 : Math.max(0, i - 24)];
  const naive = Array.from({ length: N }, (_, i) => i >= 24 ? seasonalAt(i) : null);
  const drawnAt = (k) => s.day && k >= E + 24 ? baseAt(k) + (s.s2s[23] - baseAt(k)) * Math.exp(-(k - E - 23) / s.tau) : syntheticAt(k);
  const s2s = Array.from({ length: N }, (_, i) => {
    if (s.day && i >= E && i < E + 24) return s.s2s[i - E];
    const v = drawnAt(i), prev = drawnAt(Math.max(0, i - 1));
    return Math.max(0.01, (0.7 * v + 0.3 * prev) * (1 + n2[i]) + s.bias);
  });
  const resp = Array.from({ length: N }, (_, i) => RIDGE_KERNEL.reduce((a, w, k) => a + w * (fc[i - k] ?? 0), 0));
  const basePart = (i) => (i >= 24 ? 0.5 * seasonalAt(i) + 0.5 * baseAt(i) : q[i]);
  let at = E;
  for (let i = E; i < E + 24; i++) if (resp[i] > resp[at]) at = i;
  const target = s.ridgeFrac * Math.max(...(s.day ?? Array.from({ length: 24 }, (_, k) => syntheticAt(E + k))));
  const g = resp[at] > 0 ? Math.max(0, (target - basePart(at)) / resp[at]) : 0;
  const ridge = Array.from({ length: N }, (_, i) => Math.max(0.01, basePart(i) + g * resp[i]));

  const out = { q, rain, fc, naive, ridge, s2s };
  CACHE.set(s, out);
  return out;
}

// MAPE over the event day's hours above tau: tau = 0 is ordinary MAPE, tau at
// the station threshold is thresholded MAPE. Null when no hour qualifies.
function mape(s, model, tau) {
  const d = series(s);
  let sum = 0;
  let n = 0;
  for (let i = E; i < E + 24; i++) {
    if (d.q[i] <= tau) continue;
    sum += Math.abs(d[model][i] - d.q[i]) / d.q[i];
    n++;
  }
  return n ? sum / n : null;
}
const floodHours = (s, from = 0, to = N) => series(s).q.slice(from, to).filter((v) => v > s.thr).length;
const peakAt = (s) => { const q = series(s).q; return q.indexOf(Math.max(...q)); };

/* ---------------------------------------------------------------- charts */

const niceStep = (max) => {
  const raw = max / 4;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
};
const niceMax = (v) => { const st = niceStep(v * 1.08); return Math.ceil((v * 1.08) / st) * st; };
const tickText = (v) => String(Number(v.toFixed(2)));

function widthOf(el) {
  const cs = getComputedStyle(el);
  const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return Math.max(280, Math.round(w || 640));
}

let clipN = 0;

// A hydrograph: discharge below, rainfall hanging from the top. One SVG unit
// is one CSS pixel at the width it was built for.
function plot(o) {
  const narrow = o.w < 480;
  const rainH = o.rainMax ? (narrow ? 34 : 44) : 0;
  const ht = (narrow ? 190 : 230) + rainH;
  const pad = { l: 36, r: 8, t: rainH ? rainH + 24 : 22, b: 24 };
  const span = Math.max(1, o.to - o.from);
  const x = (i) => pad.l + ((i - o.from) / span) * (o.w - pad.l - pad.r);
  const y = (v) => ht - pad.b - (Math.min(v, o.ymax) / o.ymax) * (ht - pad.b - pad.t);
  const yr = (v) => 2 + (Math.min(v, o.rainMax) / o.rainMax) * rainH;
  const el = svg("svg", { class: "chart", viewBox: `0 0 ${o.w} ${ht}`, role: "img", "aria-label": o.label });
  const defs = el.appendChild(svg("defs"));
  const layer = () => el.appendChild(svg("g"));
  const L = { grid: layer(), under: layer(), rain: layer(), lines: layer(), over: layer() };

  const step = niceStep(o.ymax);
  for (let v = 0; v <= o.ymax + 1e-9; v += step) {
    L.grid.append(svg("line", { class: v ? "tick" : "base", x1: pad.l, x2: o.w - pad.r, y1: y(v), y2: y(v) }),
      text(pad.l - 6, y(v) + 4, tickText(v), { "text-anchor": "end" }));
  }
  L.grid.append(text(pad.l - 6, pad.t - 11, "m³/s", { "text-anchor": "end" }));
  if (rainH) {
    L.grid.append(svg("line", { class: "base", x1: pad.l, x2: o.w - pad.r, y1: 2, y2: 2 }),
      text(pad.l - 6, 13, "rain", { "text-anchor": "end" }));
  }
  if (o.ticks === "day") {
    for (let i = o.from; i <= o.to; i++) {
      if (hourOf(i) !== 0) continue;
      L.grid.append(svg("line", { class: "tick", x1: x(i), x2: x(i), y1: pad.t, y2: ht - pad.b }));
      if (!narrow || dayOf(i) % 2 === 0) L.grid.append(text(x(i), ht - 7, dayLabel(o.s, i), { "text-anchor": "middle" }));
    }
  } else if (o.ticks === "rank") {
    for (const f of [0, 0.25, 0.5, 0.75, 1]) {
      const i = o.from + f * span;
      L.grid.append(text(x(i), ht - 7, `${f * 100}%`, { "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle" }));
    }
  } else {
    const every = narrow ? 6 : 3;
    for (let i = o.from; i <= o.to; i++) {
      if (hourOf(i) % every) continue;
      L.grid.append(svg("line", { class: "tick", x1: x(i), x2: x(i), y1: pad.t, y2: ht - pad.b }),
        text(x(i), ht - 7, `${pad2(hourOf(i))}:00`, { "text-anchor": i === o.from ? "start" : "middle" }));
    }
  }

  // Reveal a group left to right through a growing clip rectangle.
  const wipe = (g, from, to, ms) => {
    const id = `floodguard-clip-${++clipN}`;
    const rect = svg("rect", { class: "wipe", x: x(from) - 3, y: 0, width: x(to) - x(from) + 6, height: ht, style: `--t:${ms}ms` });
    defs.append(svg("clipPath", { id }, rect));
    g.setAttribute("clip-path", `url(#${id})`);
    if (o.instant) rect.classList.add("on");
    return () => { if (!o.instant) later(() => rect.classList.add("on")); };
  };
  const pathOf = (vals, from, to) => {
    let d = "";
    for (let i = from; i <= to; i++) {
      if (vals[i] == null) continue;
      d += `${d ? "L" : "M"}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`;
    }
    return d;
  };
  const bw = Math.max(1, (o.w - pad.l - pad.r) / span - (span > 60 ? 0.3 : 2));

  return {
    el, x, y, pad, ht,
    line(vals, cls, from = o.from, to = o.to, ms = 1600) {
      const g = svg("g", {}, svg("path", { class: `ln ${cls}`, d: pathOf(vals, from, to) }));
      L.lines.append(g);
      return { g, reveal: wipe(g, from, to, ms) };
    },
    bars(vals, cls, from = o.from, to = o.to, ms = 1200) {
      const g = svg("g");
      for (let i = from; i <= to; i++) {
        if (!(vals[i] > 0.05)) continue;
        g.append(svg("rect", { class: cls, x: (x(i) - bw / 2).toFixed(1), y: 2, width: bw.toFixed(1), height: (yr(vals[i]) - 2).toFixed(1) }));
      }
      L.rain.append(g);
      return { g, reveal: wipe(g, from, to, ms) };
    },
    shade(i0, i1, cls, layerName = "under") {
      // Whole hours, edge to edge, clipped to the plot area.
      const half = (o.w - pad.l - pad.r) / span / 2;
      const x0 = Math.max(pad.l, x(i0) - half);
      const x1 = Math.min(o.w - pad.r, x(i1) + half);
      const r = svg("rect", { class: cls, x: x0.toFixed(1), y: pad.t, width: Math.max(1, x1 - x0).toFixed(1), height: ht - pad.t - pad.b });
      L[layerName].append(r);
      return r;
    },
    hline(v, cls) {
      const l = svg("line", { class: cls, x1: pad.l, x2: o.w - pad.r, y1: y(v), y2: y(v) });
      L.over.append(l);
      return l;
    },
    vline(i, cls, top = pad.t) {
      const l = svg("line", { class: cls, x1: x(i), x2: x(i), y1: top, y2: ht - pad.b });
      L.over.append(l);
      return l;
    },
    label(xx, yy, str, attrs) {
      const t = text(xx, yy, str, attrs);
      L.over.append(t);
      return t;
    },
    add(node, layerName = "over") { L[layerName].append(node); return node; },
  };
}

// The standard window chart: discharge plus rainfall for all 240 hours.
function windowChart(card, s, instant, label) {
  const d = series(s);
  const w = widthOf(card);
  const p = plot({ w, s, from: 0, to: N - 1, ticks: "day", instant, label,
    ymax: niceMax(Math.max(...d.q, s.thr)), rainMax: Math.max(4, ...d.rain) });
  return { p, d };
}

const legend = (items) => h("div", { class: "legend" }, items.map(([label, c, box]) => h("span", { class: box ? "box" : null, style: `--c:${c}` }, label)));
const illus = (extra) => h("p", { class: "illus" }, ILLUS, extra ? ` ${extra}` : null);

/* ---------------------------------------------------------------- state */

const S = {
  sc: 0, phase: "intro", step: 0, reached: -1,
  token: 0, cd: 0, fast: false, busy: false, auto: false,
  ready: false, tried: false, tau: 0, userScrolled: false,
};
let I = {};  // intro elements
let D = {};  // score elements

function sleep(ms, tk) {
  return new Promise((resolve, reject) => {
    const end = performance.now() + ms;
    (function tick() {
      if (tk !== S.token) return reject(CANCEL);
      if (S.fast || performance.now() >= end) return resolve();
      setTimeout(tick, Math.min(50, end - performance.now()));
    })();
  });
}
// Revisited steps and reduced motion render instantly.
function makeWait(tk, instant) {
  const wait = (ms) => {
    if (tk !== S.token) return Promise.reject(CANCEL);
    return instant || reduced ? Promise.resolve() : sleep(ms, tk);
  };
  wait.instant = instant || reduced;
  return wait;
}

// Keep the newest element above the pinned nav while a step the reader started
// plays, unless they have scrolled away in the meantime.
function show(el, last = el) {
  if (S.userScrolled || !el.isConnected) return;
  const top = el.getBoundingClientRect().top;
  const bottom = last.getBoundingClientRect().bottom;
  const progress = $("progress");
  const topLimit = (progress.hidden ? 0 : progress.offsetHeight) + 12;
  const bottomLimit = innerHeight - root.querySelector(".nav").offsetHeight - 12;
  if (bottom <= bottomLimit) return;
  const delta = Math.min(bottom - bottomLimit, top - topLimit);
  if (delta > 0) scrollBy({ top: delta, behavior: reduced || S.fast ? "auto" : "smooth" });
}

// A new step starts at the top of the stage; if the reader has scrolled past
// it, bring it back just under the pinned progress bar.
function bringIntoView() {
  const progress = $("progress");
  const offset = $("stage").getBoundingClientRect().top - (progress.hidden ? 0 : progress.offsetHeight) - 12;
  if (offset < 0) scrollBy({ top: offset, behavior: reduced ? "auto" : "smooth" });
}

// The gauges start replaying the first time the card is on screen.
const visible = new Promise((resolve) => {
  const io = new IntersectionObserver(([entry]) => {
    if (!entry.isIntersecting) return;
    io.disconnect();
    resolve();
  }, { threshold: 0.25 });
  io.observe(host);
});

const steps = () => ORDER.map((key) => ({ key, title: META[key].title }));

/* ------------------------------------------------------------- chrome */

function renderPicker() {
  const s = cur();
  $("groups").replaceChildren(...GROUPS.map((g) => {
    const b = h("button", { class: "opt", type: "button", "aria-pressed": String(g.id === s.group) }, g.label);
    b.onclick = () => select(SCENARIOS.findIndex((t) => t.group === g.id));
    return b;
  }));
  $("examples").replaceChildren(...SCENARIOS.map((x, i) => [x, i]).filter(([x]) => x.group === s.group).map(([x, i]) => {
    const b = h("button", { class: "opt", type: "button", "aria-pressed": String(i === S.sc) }, x.chip);
    b.onclick = () => select(i);
    return b;
  }));
  $("blurb").textContent = s.blurb;
}

function renderProgress() {
  const bar = $("progress");
  bar.hidden = S.phase !== "pipeline";
  if (bar.hidden) return;
  const list = steps();
  const s = cur();
  $("prog-title").textContent = `Step ${S.step + 1} of ${list.length} · ${list[S.step].title}`;
  $("prog-event").textContent = `${s.station} · ${s.chip}${s.date ? `, ${s.when}` : ""}`;
  $("segs").replaceChildren(...list.map((st, i) => {
    const state = i === S.step ? "current" : i <= S.reached ? "done" : "";
    const b = h("button", { class: `seg ${state}`, type: "button", disabled: i > S.reached, "aria-label": `Step ${i + 1}: ${st.title}`, title: st.title, "aria-current": i === S.step ? "step" : null });
    b.onclick = () => go(i);
    return b;
  }));
}

function updateNav() {
  const back = $("back");
  const next = $("next");
  if (S.phase === "intro") {
    back.disabled = true;
    next.textContent = host.clientWidth <= 640 ? "Replay →" : "Replay the event →";
    next.disabled = false;
    return;
  }
  const list = steps();
  const key = list[S.step].key;
  back.disabled = S.step === 0;
  next.disabled = false;
  if (S.busy) next.textContent = "Skip animation";
  else if (key === "score" && !S.tried) { next.textContent = "Move the threshold ↑"; next.disabled = true; }
  else if (key === "recap") next.textContent = "Next example →";
  else next.textContent = host.clientWidth <= 640 ? "Next →" : `Next: ${list[S.step + 1].title} →`;
}

function stopCountdown() {
  S.cd++;
  $("next").classList.remove("counting");
}

async function countdown(ms) {
  const id = ++S.cd;
  const btn = $("next");
  btn.classList.remove("counting");
  void btn.offsetWidth;
  btn.style.setProperty("--dur", `${ms}ms`);
  btn.classList.add("counting");
  await new Promise((r) => setTimeout(r, ms));
  if (id !== S.cd) return false;
  btn.classList.remove("counting");
  return S.auto;
}

async function autoAdvance() {
  if (!S.auto || S.busy) return;
  if (S.phase === "intro") {
    if (S.ready && await countdown(2500)) start();
    return;
  }
  const key = steps()[S.step].key;
  if (key === "score" && !S.tried) {
    if (await countdown(3500)) sweepTau();
    return;
  }
  if (await countdown(key === "recap" ? 9000 : 7000)) advance();
}

function advance() {
  if (S.phase === "intro") return start();
  if (S.busy) {
    S.fast = true;
    $("stage").classList.add("fast");
    return;
  }
  if (steps()[S.step].key === "recap") return select((S.sc + 1) % SCENARIOS.length);
  go(S.step + 1);
}

/* ----------------------------------------------------------------- intro */

function select(i, scroll = true) {
  stopCountdown();
  const tk = ++S.token;
  Object.assign(S, { sc: i, phase: "intro", step: 0, reached: -1, ready: false, tried: false, tau: 0, busy: false, fast: false });
  renderPicker();
  renderProgress();
  renderIntro();
  updateNav();
  if (scroll) bringIntoView();
  replayGauges(tk).catch((e) => { if (e !== CANCEL) throw e; });
}

function renderIntro() {
  const s = cur();
  const g = GROUPS.find((x) => x.id === s.group);
  const gauge = (label, unit) => {
    const b = h("b", {}, "–");
    return [h("div", { class: "gauge" }, h("span", {}, label), b, unit ? h("small", {}, unit) : null), b];
  };
  const [tBox, tVal] = gauge("Hour", null);
  const [qBox, qVal] = gauge("Discharge", "m³/s");
  const [rBox, rVal] = gauge("Basin rainfall", "mm/h");
  const line = svg("path", { d: "", fill: "none", stroke: "var(--obs)", "stroke-width": 2, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" });
  const spark = svg("svg", { class: "spark", viewBox: `0 0 ${N - 1} 70`, preserveAspectRatio: "none", "aria-hidden": "true" }, line);
  I = { tVal, qVal, rVal, line, start: h("button", { class: "btn primary submit", type: "button" }, "Replay the event") };
  I.start.onclick = start;
  $("stage").replaceChildren(
    h("div", { class: "head reveal" },
      h("p", { class: "eyebrow" }, "Interactive walkthrough · ", g.label),
      h("h3", { class: "t1" }, "Forecast a river up to 24 hours ahead"),
      h("p", { class: "lede" }, `Ten days of hourly readings at station ${s.station} are coming in. Replay the event, then step through how FloodGuard forecasts it and how the forecast is scored.`)),
    h("div", { class: "card reveal" },
      h("div", { class: "from" }, h("span", {}, "Station ", h("span", { class: "code" }, s.station)), h("span", {}, s.date ? s.when : "An ordinary week")),
      h("div", { class: "gauges" }, tBox, qBox, rBox),
      spark,
      I.start),
    h("p", { class: "small note reveal" }, ILLUS));
}

async function replayGauges(tk) {
  const s = cur();
  const d = series(s);
  const wait = makeWait(tk, false);
  const top = Math.max(...d.q) * 1.1;
  const yy = (v) => (70 - (v / top) * 66).toFixed(1);
  let path = "";
  await visible;
  await wait(400);
  for (let i = 0; i < N; i++) {
    path += `${i ? "L" : "M"}${i},${yy(d.q[i])}`;
    if (i % 2 && i < N - 1) continue;
    I.line.setAttribute("d", path);
    I.tVal.textContent = stamp(s, i);
    I.qVal.textContent = flow(d.q[i]);
    I.rVal.textContent = d.rain[i].toFixed(1);
    await wait(16);
  }
  S.ready = true;
  I.start.classList.add("pulse");
  autoAdvance();
}

function start() {
  if (S.phase !== "intro") return;
  stopCountdown();
  S.token++;
  S.ready = true;
  S.phase = "pipeline";
  go(0);
}

/* ------------------------------------------------------------------ steps */

async function go(i) {
  if (S.phase !== "pipeline" || i < 0 || i > S.reached + 1 || i >= steps().length) return;
  stopCountdown();
  const tk = ++S.token;
  const seen = i <= S.reached;
  Object.assign(S, { step: i, reached: Math.max(S.reached, i), busy: true, fast: false, userScrolled: false });
  const key = steps()[i].key;
  renderProgress();
  updateNav();
  announce(`Step ${i + 1}: ${META[key].title}`);
  const stage = $("stage");
  stage.replaceChildren();
  stage.classList.remove("fast");
  bringIntoView();
  try {
    await RENDER[key](stage, cur(), makeWait(tk, seen));
  } catch (e) {
    if (e === CANCEL) return;
    throw e;
  }
  if (tk !== S.token) return;
  S.busy = false;
  renderProgress();
  updateNav();
  autoAdvance();
}

const head = (key) => h("div", { class: "head reveal" },
  h("p", { class: "eyebrow" }, `Step ${S.step + 1} · ${META[key].method}`),
  h("h3", { class: "t2" }, META[key].title),
  h("p", { class: "lede" }, META[key].lede));

function why(key) {
  const w = WHY[key];
  return h("div", { class: "why reveal" },
    h("p", { class: "why-k" }, "Why it's built this way"),
    h("p", { class: "why-main" }, h("b", {}, w.num), h("span", {}, w.text)),
    h("details", {}, h("summary", {}, "More"), h("div", {}, w.more.map((t) => h("p", {}, t)))));
}

const mechanics = (...kids) => h("details", { class: "mech reveal" }, h("summary", {}, "Show the mechanics"), h("div", {}, kids));
const result = (tone, big, ...txt) => h("div", { class: `result ${tone} reveal` }, big ? h("span", { class: "big" }, big) : null, h("span", {}, txt));

// Finish a step: result line, then the design note and optional mechanics.
function finish(stage, ...parts) {
  const kept = parts.filter(Boolean);
  for (const p of kept) stage.append(p);
  // Mechanics stay folded, so the result and the design note are what must fit.
  const shown = kept.filter((p) => !p.classList.contains("mech"));
  if (shown.length) show(shown[0], shown.at(-1));
}

// Merge consecutive hours above the threshold into runs [first, last].
function floodRuns(s, from = 0, to = N - 1) {
  const q = series(s).q;
  const runs = [];
  for (let i = from; i <= to; i++) {
    if (q[i] <= s.thr) continue;
    const last = runs.at(-1);
    if (last && last[1] === i - 1) last[1] = i;
    else runs.push([i, i]);
  }
  return runs;
}

function peakDot(p, s, i, v, label) {
  p.add(svg("circle", { class: "dot reveal", cx: p.x(i).toFixed(1), cy: p.y(v).toFixed(1), r: 4 }));
  const right = p.x(i) > p.el.viewBox.baseVal.width - 90;
  p.label(p.x(i) + (right ? -9 : 9), p.y(v) + 4, label, { class: "mark-l", "text-anchor": right ? "end" : "start" });
}

const RENDER = {
  async gauges(stage, s, wait) {
    stage.append(head("gauges"));
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, `Station ${s.station} · ten days, hour by hour`));
    stage.append(card);
    const { p, d } = windowChart(card, s, wait.instant, `Hourly discharge and rainfall at ${s.station}`);
    const rain = p.bars(d.rain, "rain", 0, N - 1, 2200);
    const q = p.line(d.q, "q", 0, N - 1, 2200);
    card.append(p.el,
      legend([["Discharge", "var(--obs)"], ["Basin-weighted rainfall, hanging from the top", "var(--rain)", true]]),
      illus());
    await wait(500);
    rain.reveal();
    q.reveal();
    await wait(2400);
    const pk = peakAt(s);
    peakDot(p, s, pk, d.q[pk], `${flow(d.q[pk])} m³/s`);
    await wait(600);
    const top = Math.max(...d.rain);
    const r = d.rain.indexOf(top);
    const wA = 0.4, wB = 0.35, wC = 0.25;
    const a = top * 1.25;
    const b = top * 0.85;
    const c = (top - wA * a - wB * b) / wC;
    finish(stage,
      s.peak
        ? result("", s.peak[0], s.peak[1])
        : result("", `${flow(Math.max(...d.q))} m³/s`, "at most in this window (illustrative). Rain comes and goes; the river stays low."),
      why("gauges"),
      mechanics(
        h("div", {}, h("h4", {}, "1 · Discharge is a flow rate"),
          h("p", { class: "small" }, "Cubic meters of water passing the station each second, read every hour.")),
        h("div", {}, h("h4", {}, `2 · Rain gauges become one basin rainfall series (${stamp(s, r)}, gauges and weights illustrative)`),
          h("p", { class: "formula" }, `${wA.toFixed(2)} × ${a.toFixed(1)} + ${wB.toFixed(2)} × ${b.toFixed(1)} + ${wC.toFixed(2)} × ${c.toFixed(1)} = ${top.toFixed(1)} mm/h`),
          h("p", { class: "small" }, "Each gauge counts in proportion to the part of the basin it stands for, so one gauge in a corner can't dominate."))));
  },

  async floods(stage, s, wait) {
    stage.append(head("floods"));
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, `Hours above the high-flow threshold at ${s.station}`));
    stage.append(card);
    const { p, d } = windowChart(card, s, true, `Discharge with the high-flow threshold at ${s.thr} m³/s`);
    p.bars(d.rain, "rain");
    p.line(d.q, "q");
    const n = floodHours(s);
    const fill = h("i", { style: "--c:var(--bad)" });
    card.append(p.el,
      legend([["Discharge", "var(--obs)"], ["High-flow threshold (level illustrative)", "var(--bad)"], ["High-flow hours", "color-mix(in srgb, var(--bad) 25%, white)", true]]),
      h("div", { class: "bars" }, h("div", { class: "bar-row" },
        h("span", { class: "label", style: "--c:var(--bad)" }, "High-flow hours"), h("span", { class: "bar" }, fill), h("span", { class: "pct" }, `${n} / ${N}`))),
      illus());
    await wait(600);
    const thr = p.hline(s.thr, "thr fade hidden");
    const lab = p.label(p.x(N - 1), p.y(s.thr) - 5, `threshold ${s.thr} m³/s`, { class: "thr-l fade hidden", "text-anchor": "end" });
    later(() => { thr.classList.remove("hidden"); lab.classList.remove("hidden"); });
    await wait(900);
    for (const [i0, i1] of floodRuns(s)) {
      p.shade(i0, i1, "flood fade hidden");
    }
    later(() => { for (const r of p.el.querySelectorAll(".flood")) r.classList.remove("hidden"); });
    later(() => { fill.style.width = `${Math.max(0.6, (n / N) * 100)}%`; });
    await wait(1000);
    const sorted = [...d.q].sort((x, y) => y - x);
    const fdc = plot({ w: Math.min(widthOf(card) - 32, 520), s, from: 0, to: N - 1, ticks: "rank", instant: true,
      ymax: niceMax(Math.max(sorted[0], s.thr)), label: "Discharge sorted from highest to lowest" });
    fdc.line(sorted, "q");
    fdc.hline(s.thr, "thr");
    const above = sorted.filter((v) => v > s.thr).length;
    if (above) fdc.shade(0, above - 1, "flood");
    finish(stage,
      n
        ? result("bad", `${n} h`, `of ${N} are above the threshold, and this window was picked around a flood. Across a station's whole record, the share is far smaller.`)
        : result("", "0 h", `of ${N} are above the threshold. Nothing in this window counts toward the flood score, and most of a station's record looks like this.`),
      why("floods"),
      mechanics(
        h("div", {}, h("h4", {}, "The threshold is a quantile of discharge"), fdc.el,
          h("p", { class: "small" }, `Every hour in this window, sorted from highest flow to lowest. A discharge-quantile threshold cuts near the top of the station's whole record; the level drawn here is illustrative. ${above ? `${above} hours fall above it.` : "No hour here reaches it."}`))));
  },

  async origin(stage, s, wait) {
    stage.append(head("origin"));
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, `Forecast origin: ${stamp(s, O)}`));
    stage.append(card);
    const { p, d } = windowChart(card, s, wait.instant, "The forecast origin, the 168-hour history and 72 hours of future rainfall");
    p.shade(0, O, "hist");
    const rain = p.bars(d.rain, "rain", 0, O);
    const q = p.line(d.q, "q", 0, O);
    const fc = p.bars(d.fc, "rainfc", O + 1, N - 1, 1400);
    p.vline(O, "origin", 0);
    // Window labels sit on either side of the origin, above the plot; the
    // horizon marker's label sits at the bottom, where no line is drawn yet.
    const yt = p.pad.t + 14;
    const lH = p.label(p.x(O) - 6, yt, "← 168 h history", { class: "brk-l fade hidden", "text-anchor": "end" });
    const lF = p.label(p.x(O) + 6, yt, "72 h ahead →", { class: "brk-l fade hidden", "text-anchor": "start" });
    const tgt = p.vline(O + H, "tgt-ln", yt + 8);
    const tLab = p.label(p.x(O + H) + 6, p.ht - p.pad.b - 8, "+24 h", { class: "mark-l" });
    const range = h("input", { type: "range", min: 1, max: 72, value: H, "aria-label": "Forecast horizon in hours", style: "width:100%;accent-color:var(--accent)" });
    const readout = h("p", { class: "small" });
    const setH = (hz) => {
      const xx = p.x(O + hz);
      tgt.setAttribute("x1", xx); tgt.setAttribute("x2", xx);
      tLab.setAttribute("x", xx + (hz > 50 ? -6 : 6));
      tLab.setAttribute("text-anchor", hz > 50 ? "end" : "start");
      tLab.textContent = `+${hz} h`;
      readout.replaceChildren(h("b", {}, `Horizon ${hz} h`), ` → the forecast for ${stamp(s, O + hz)}${O + hz === peakAt(s) ? ", the peak hour" : ""}`);
    };
    range.oninput = () => setH(Number(range.value));
    setH(H);
    for (const el of [tgt, tLab]) el.classList.add("fade", "hidden");
    card.append(p.el,
      legend([["Discharge, known up to the origin", "var(--obs)"], ["Observed rainfall", "var(--rain)", true], ["Future rainfall input (observed, in backtests)", "color-mix(in srgb, var(--rain-fc) 55%, white)", true]]),
      h("div", { style: "margin-top:14px" }, range, readout),
      illus());
    await wait(500);
    rain.reveal();
    q.reveal();
    lH.classList.remove("hidden");
    await wait(1400);
    fc.reveal();
    lF.classList.remove("hidden");
    await wait(1400);
    tgt.classList.remove("hidden");
    tLab.classList.remove("hidden");
    await wait(700);
    finish(stage,
      result("", "168 + 72 h", "in: the past week of discharge and rainfall, plus rainfall for the next 72 hours (observed, in the backtests). Out: one discharge value for each of the next 72 hours."),
      why("origin"),
      mechanics(
        h("div", {}, h("h4", {}, "One run, every hour forecast"),
          h("p", { class: "small" }, "In the real seq2seq runs, at origin t the model reads t − 168 to t and forecasts every hour from t + 1 to t + 72 in one run; the 24-hour runs stop at t + 24. No discharge after the origin is an input. Here, the event day covers leads 1–24; its 16:00 observed peak is at lead 17 h. The walkthrough draws illustrative lines rather than running those models."))));
  },

  async models(stage, s, wait) {
    stage.append(head("models"));
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, `${dayLabel(s, E)} · one forecast issued ${stamp(s, O)}, 1–24 hours ahead`));
    stage.append(card);
    const { p, d, lines } = dayChart(card, s, wait.instant);
    const q = p.line(d.q, "q", E, E + 23, 1400);
    const note = h("p", { class: "small", style: "min-height:2.6em;margin-top:8px" });
    const toggles = h("div", { class: "lgs" },
      h("span", { class: "lg", style: "--c:var(--obs)" }, "Observed"),
      MODELS.map((m) => {
        const b = h("button", { class: "lg", type: "button", style: `--c:${m.c}`, "aria-pressed": "true", disabled: true }, m.name);
        b.onclick = () => {
          const on = b.getAttribute("aria-pressed") !== "true";
          b.setAttribute("aria-pressed", String(on));
          lines[m.id].g.style.display = on ? "" : "none";
        };
        return b;
      }));
    card.append(p.el, toggles, note,
      h("p", { class: "illus" }, s.day
        ? "Observed and seq2seq lines traced from the published event figure; seasonal-naive repeats the last observed day of the illustrative series. Ridge is a synthetic rainfall response scaled to the observed event peak. The baselines are not measured model output."
        : "All lines illustrative: seasonal-naive repeats the last observed day; Ridge and seq2seq are drawn to illustrate possible behavior, not measured model output."));
    await wait(500);
    q.reveal();
    await wait(1500);
    for (const [k, m] of MODELS.entries()) {
      lines[m.id].reveal();
      note.replaceChildren(h("b", {}, m.name), `: ${m.note}.`);
      toggles.children[k + 1].disabled = false;
      await wait(1900);
    }
    note.replaceChildren("Click a model above to hide or show its line.");
    const [tone, big, txt] = s.outcome;
    finish(stage,
      result(tone, big, txt),
      why("models"),
      mechanics(
        h("div", {}, h("h4", {}, "Seq2seq LSTM with attention"),
          h("div", { class: "flow" },
            h("span", { class: "pill" }, "168 h discharge + rainfall"), h("span", { class: "pill" }, "72 h future rainfall"),
            h("span", { class: "arrow" }, "→"), h("span", { class: "pill on" }, "Encoder"),
            h("span", { class: "arrow" }, "→"), h("span", { class: "pill on" }, "Attention"),
            h("span", { class: "arrow" }, "→"), h("span", { class: "pill on" }, "Decoder"),
            h("span", { class: "arrow" }, "→"), h("span", { class: "pill" }, "72 hourly values")),
          h("p", { class: "small", style: "margin-top:8px" }, "The encoder LSTM summarizes the input hours. Attention lets each forecast hour weigh the input hours it depends on, such as a burst of rain, before the decoder LSTM writes the forecast.")),
        h("div", {}, h("h4", {}, "The baselines"),
          h("p", { class: "small" }, "Seasonal-naive repeats the last observed day across the horizon; this demo uses a 24-hour season. Ridge is a regularized linear regression, represented here by a synthetic rainfall response. In the real campaign persistence is the stronger baseline; see the station table below."))));
  },

  async score(stage, s) {
    stage.append(head("score"));
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, `Score ${dayLabel(s, E)}: which hours count?`));
    stage.append(card);
    const dayQ = series(s).q.slice(E, E + 24);
    const top = Math.max(s.thr * 1.2, Math.max(...dayQ) * 1.05);
    const { p, d, lines } = dayChart(card, s, true, s.thr * 1.2);
    p.line(d.q, "q", E, E + 23);
    for (const m of MODELS) lines[m.id].reveal();
    const cells = [];
    for (let i = E; i < E + 24; i++) cells.push(p.shade(i, i, "scored"));
    const tauLine = p.hline(0, "thr");
    const tauLab = p.label(p.pad.l + 6, 0, "", { class: "thr-l" });
    const stepSize = top > 30 ? 1 : top > 6 ? 0.5 : 0.1;
    const range = h("input", { type: "range", min: 0, max: (Math.ceil(top / stepSize) * stepSize).toFixed(1), step: stepSize, value: 0,
      "aria-label": "Score only hours above this discharge, m³/s", style: "width:100%;accent-color:var(--accent)" });
    const readout = h("p", { class: "small" });
    const presets = h("div", { class: "opts mode", role: "group", "aria-label": "Presets" },
      h("button", { class: "opt", type: "button", "data-t": "0" }, "All hours: MAPE"),
      h("button", { class: "opt", type: "button", "data-t": String(s.thr) }, `High-flow hours: thresholded MAPE`));
    const rows = MODELS.map((m) => {
      const fill = h("i", { style: `--c:${m.c}` });
      const rank = h("span", { class: "rank" });
      const val = h("span", { class: "pct" });
      const row = h("div", { class: "bar-row" }, h("span", { class: "label", style: `--c:${m.c}` }, rank, m.short), h("span", { class: "bar" }, fill), val);
      return { m, row, fill, rank, val };
    });
    const board = h("div", { class: "bars" }, rows.map((r) => r.row));
    const hint = h("p", { class: "try" }, `Drag the threshold, or pick a preset. ${s.day ? "Watch the ranking." : "Watch what is left to score."}`);
    card.append(p.el, presets, range, readout, board, hint,
      h("p", { class: "illus" }, "Scores are computed live on the illustrative series above. They are not the project's measured results."));
    D = { stage, s, p, cells, tauLine, tauLab, range, readout, rows, board, hint, presets };
    range.oninput = () => setTau(Number(range.value), true);
    for (const b of presets.children) b.onclick = () => { range.value = b.dataset.t; setTau(Number(b.dataset.t), true); };
    setTau(S.tried ? S.tau : 0, false);
    if (S.tried) revealScore(false);
  },

  async serve(stage, s, wait) {
    stage.append(head("serve"));
    const files = [
      ["Predictions", "every forecast value"],
      ["Metrics", "per-event RMSE and thresholded MAPE"],
      ["Plots", "forecast against observed"],
      ["Fitted model", "the checkpoint"],
      ["Manifest", "what produced the run"],
    ];
    const grid = h("div", { class: "files" });
    stage.append(h("div", { class: "card reveal" },
      h("p", { class: "card-label" }, "Run report · seq2seq"),
      grid,
      h("p", { class: "small", style: "margin-top:12px" }, "Every completed, persisted run writes one, baselines included. The project's Ridge report covers 168 h of history, a 72 h horizon and three event backtests.")));
    await wait(500);
    for (const [name, what] of files) {
      grid.append(h("div", { class: "file reveal" }, name, h("small", {}, what)));
      await wait(380);
    }
    await wait(400);
    const checks = [
      "Registered as a candidate",
      "Checkpoint loads",
      "Inputs match the input contract",
      "Promoted to serving champion",
    ];
    const gate = h("ol", { class: "gate" });
    const card = h("div", { class: "card reveal" }, h("p", { class: "card-label" }, "Checkpoint checks"), gate);
    stage.append(card);
    show(card);
    for (const c of checks) {
      const li = h("li", { class: "busy reveal" }, c);
      gate.append(li);
      await wait(650);
      li.className = "pass";
    }
    await wait(300);
    const d = series(s);
    const pts = d.s2s.slice(O + 1, N).map((v, k) => `${k ? "L" : "M"}${k},${(40 - (v / Math.max(...d.s2s.slice(O + 1, N))) * 36).toFixed(1)}`).join("");
    const served = h("div", { class: "served" },
      h("span", { class: "mark" }, "API"),
      h("span", {}, h("b", {}, "FastAPI forecast service"),
        h("small", {}, `Serving the champion: 72 hourly values from ${stamp(s, O)} (illustrative)`),
        svg("svg", { class: "spark", viewBox: "0 0 71 40", preserveAspectRatio: "none", style: "height:40px;margin-top:6px", "aria-hidden": "true" },
          svg("path", { d: pts, fill: "none", stroke: "var(--s2s)", "stroke-width": 2, "vector-effect": "non-scaling-stroke" }))));
    card.append(served);
    show(card);
    await wait(700);
    finish(stage,
      result("", "✓", "Weak baselines stay as visible as strong models: every completed, persisted run gets the same report, and only checked checkpoints are served."),
      why("serve"),
      mechanics(h("div", {}, h("h4", {}, "Why check before serving"),
        h("p", { class: "small" }, "A checkpoint that fails to load, or expects different inputs from the ones the service sends, stays a candidate. Only one that passes both checks answers forecast requests."))));
  },

  async recap(stage, s, wait) {
    stage.append(h("div", { class: "head reveal" }, h("p", { class: "eyebrow" }, "Recap"), h("h3", { class: "t2" }, `What happened at ${s.station}`)));
    const n = floodHours(s);
    const nDay = floodHours(s, E, E + 24);
    const rows = [
      ["Gauges", `${N} hourly readings of discharge and basin-weighted rainfall`],
      ["High flow", n ? `${n} hours above the high-flow threshold` : "No hour above the high-flow threshold"],
      ["Origin", `${stamp(s, O)}: 168 h of history, 72 h of future rainfall`],
      ["Models", s.recapModels],
      ["Score", nDay ? `High-flow hours: seq2seq ${pct(mape(s, "s2s", s.thr))}, seasonal-naive ${pct(mape(s, "naive", s.thr))} (illustrative; persistence is stronger in the real station campaign)` : "Nothing above the threshold to score"],
      ["Serve", "Report written; checkpoint checks passed"],
    ];
    const list = h("ol", { class: "path" });
    stage.append(h("div", { class: "card reveal" }, list));
    for (const [i, [k, v]] of rows.entries()) {
      list.append(h("li", { class: "reveal" }, h("span", {}, i + 1), h("b", {}, k), h("span", {}, v)));
      await wait(220);
    }
    await wait(400);
    const tile = (big, label) => h("div", { class: "tile" }, h("b", {}, big), h("span", {}, label));
    stage.append(h("div", { class: "card reveal" }, h("p", { class: "card-label" }, "Across the project"),
      h("div", { class: "tiles" },
        tile("<10%", "older seq2seq peak error on flood events, outside small, flashy basins"),
        tile("27.6% vs 44.3%", "best station, D13A074: GRU vs persistence, 1–12 h leads"),
        tile("8 stations", "in conditional backtests with observed rainfall"),
        tile("TÜBİTAK 1832", "R&D project"))));
    await wait(400);
    const lesson = {
      "Sharp peak": "Selected events show both sides: this sharp peak was matched closely, while at D08A084, a small and flashy basin, the rise started on time but the peak was an hour late and too low.",
      "Flashy basin": "Small, flashy basins are the hard case: the rise starts on time here, but the peak is an hour late and too low.",
    }[s.chip] || "Weeks like this are most of the record. Scored on their own, they would hide the floods.";
    stage.append(h("div", { class: "card limit reveal" }, h("p", { class: "card-label" }, "The honest limit"),
      h("p", {}, lesson),
      h("p", {}, "The older seq2seq models run in three FloodGuard warning systems on forecast rainfall. No newer per-station candidate passes the replacement gate yet. These backtests use observed rainfall, so live warning accuracy isn't measured here.")));
    await wait(400);
    const others = SCENARIOS.map((x, i) => [x, i]).filter(([, i]) => i !== S.sc).map(([x, i]) => {
      const b = h("button", { class: "pathcard", type: "button" }, h("b", {}, `${x.chip} · ${x.station}`), h("span", {}, x.blurb));
      b.onclick = () => select(i);
      return b;
    });
    finish(stage,
      h("div", { class: "card reveal" }, h("p", { class: "card-label" }, "Try another event"), h("div", { class: "paths" }, others)));
  },
};

// The event day: rainfall, and one wiped line per model, ready to reveal.
function dayChart(card, s, instant, minTop = 0) {
  const d = series(s);
  const peak = Math.max(...[d.q, d.naive, d.ridge, d.s2s].flatMap((a) => a.slice(E, E + 24)));
  const p = plot({ w: widthOf(card), s, from: E, to: E + 23, ticks: "hour", instant,
    ymax: niceMax(Math.max(peak, minTop, s.thr <= peak * 1.3 ? s.thr : 0)), rainMax: Math.max(4, ...d.rain.slice(E, E + 24)),
    label: `Observed discharge and three forecasts issued at the origin, on ${dayLabel(s, E)}` });
  p.bars(d.rain, "rain", E, E + 23).reveal();
  const lines = {};
  for (const m of MODELS) lines[m.id] = p.line(d[m.id], m.id, E, E + 23, 1500);
  return { p, d, lines };
}

function setTau(t, user) {
  const { s, p, cells, tauLine, tauLab, readout, rows, board, presets } = D;
  S.tau = t;
  const q = series(s).q;
  let n = 0;
  cells.forEach((c, k) => {
    const on = q[E + k] > t;
    c.style.opacity = on ? "" : "0";
    n += on;
  });
  const yy = p.y(t).toFixed(1);
  tauLine.setAttribute("y1", yy);
  tauLine.setAttribute("y2", yy);
  tauLine.style.opacity = t > 0 ? "" : "0";
  tauLab.setAttribute("y", yy - 5);
  tauLab.textContent = t > 0 ? `${tickText(t)} m³/s` : "";
  const kind = t === 0 ? " · ordinary MAPE" : t === s.thr ? " · the station's threshold: thresholded MAPE" : "";
  readout.replaceChildren(h("b", {}, `Hours above ${tickText(t)} m³/s: ${n} of 24`), kind);
  for (const b of presets.children) b.setAttribute("aria-pressed", String(Number(b.dataset.t) === t));

  const scored = rows.map((r) => ({ r, v: mape(s, r.m.id, t) }));
  const max = Math.max(1, ...scored.map((x) => x.v ?? 0));
  const order = [...scored].sort((a, b) => (a.v ?? Infinity) - (b.v ?? Infinity));
  // FLIP: re-order the leaderboard, then slide rows from where they were.
  const before = new Map(rows.map((r) => [r.row, r.row.getBoundingClientRect().top]));
  board.append(...order.map((x) => x.r.row));
  for (const [i, x] of order.entries()) {
    const row = x.r.row;
    const dy = before.get(row) - row.getBoundingClientRect().top;
    if (dy) {
      row.style.transition = "none";
      row.style.transform = `translateY(${dy}px)`;
      later(() => { row.style.transition = ""; row.style.transform = ""; });
    }
    x.r.rank.textContent = x.v == null ? "–" : `#${i + 1}`;
    x.r.val.textContent = pct(x.v);
    x.r.fill.style.width = x.v == null ? "0" : `${(x.v / max) * 100}%`;
  }
  if (user && !S.tried) {
    stopCountdown();
    S.tried = true;
    revealScore(true);
    updateNav();
    autoAdvance();
  }
}

function revealScore(scroll) {
  const { stage, s, hint } = D;
  hint.remove();
  const best = (tau) => MODELS.map((m) => [m, mape(s, m.id, tau)]).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1])[0];
  const [mA, vA] = best(0);
  const flood = floodHours(s, E, E + 24);
  let out;
  if (!flood) {
    out = result("", "0 h", `above the station's threshold, so this day adds nothing to the flood score. On all hours, ${mA.short} looks best at ${pct(vA)}.`);
  } else {
    const [mF, vF] = best(s.thr);
    const nearZero = Math.min(...series(s).q.slice(E, E + 24)) < 0.5;
    out = mA !== mF
      ? result("warn", "Flipped", `On all hours ${mA.short} ranks first (${pct(vA)}); on high-flow hours ${mF.short} does (${pct(vF)}).${nearZero ? " Near-zero flow blew up the ordinary MAPE." : ""}`)
      : result("warn", `${pct(mape(s, "naive", 0))} → ${pct(mape(s, "naive", s.thr))}`, `Seasonal-naive's error, all hours against high-flow hours: the quiet hours made its miss look smaller. ${mF.short} leads either way here, at ${pct(vF)} on the high-flow hours.`);
  }
  const fold = (k) => h("div", { class: "fold" }, h("span", {}, `Fold ${k + 1}`),
    h("div", { class: "fold-bar" }, h("span", { class: "tr", style: `width:${40 + k * 20}%` }), h("span", { class: "te", style: "width:12%" })));
  stage.append(out, why("score"), mechanics(
    h("div", {}, h("h4", {}, "Thresholded MAPE"),
      h("p", { class: "formula" }, "mean over hours with yₜ > τ of |ŷₜ − yₜ| / yₜ"),
      h("p", { class: "small", style: "margin-top:8px" }, "Ordinary MAPE is the same with τ = 0. At 0.1 m³/s, forecasting 0.3 is a 200% error that nobody downstream would notice; above the threshold, every percent is a percent of a flood.")),
    h("div", {}, h("h4", {}, "Expanding-window backtests"),
      h("div", { class: "folds" }, [0, 1, 2].map(fold)),
      h("p", { class: "small", style: "margin-top:8px" }, "Train on everything before a test window (cyan), score the window (orange), then grow the training set and move on. Peak-event windows are scored separately from ordinary flow."))));
  if (scroll) show(out, stage.querySelector(".why"));
}

// Autoplay moves the threshold for the reader.
async function sweepTau() {
  if (S.tried || steps()[S.step].key !== "score") return;
  const tk = S.token;
  const target = D.s.thr;
  for (let k = 1; k <= 24; k++) {
    if (tk !== S.token || S.tried) return;
    const t = k === 24 ? target : Number(((target * k) / 24).toFixed(2));
    D.range.value = t;
    setTau(t, k === 24);
    await new Promise((r) => setTimeout(r, reduced ? 0 : 45));
  }
}

/* --------------------------------------------------------------- wiring */

$("next").onclick = () => { stopCountdown(); advance(); };
$("back").onclick = () => {
  stopCountdown();
  if (S.phase === "pipeline" && S.step > 0) go(S.step - 1);
};
$("auto").onchange = (e) => {
  S.auto = e.target.checked;
  if (S.auto) autoAdvance();
  else stopCountdown();
};
for (const ev of ["wheel", "touchmove"]) {
  addEventListener(ev, () => { if (S.busy) S.userScrolled = true; }, { passive: true });
}
// Arrow keys step through the demo only while focus is inside it, and leave
// the sliders alone.
host.addEventListener("keydown", (e) => {
  const target = e.composedPath()[0];
  if (e.altKey || e.ctrlKey || e.metaKey || target.closest?.("summary") || target.matches?.("input[type=range]")) return;
  if (e.key === "ArrowRight" && !$("next").disabled) { e.preventDefault(); $("next").click(); }
  if (e.key === "ArrowLeft" && !$("back").disabled) { e.preventDefault(); $("back").click(); }
});

select(0, false);
})();
</script>
