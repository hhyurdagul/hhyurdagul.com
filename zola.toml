# Zola emits giallo-light.css / giallo-dark.css from these themes; they are not
# linked directly. static/css/syntax.css merges them with light-dark() so code
# follows the page theme without swapping stylesheets.
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

