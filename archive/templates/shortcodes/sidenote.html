{#- A numbered note: in the margin on wide screens, tap to open below the line on narrow ones. One line, so no whitespace leaks into the prose. Usage: {% sidenote(id="unique") %}Note text{% end %} -#}<input type="checkbox" id="sn-{{ id }}" class="sn-toggle"><label for="sn-{{ id }}" class="sn-ref" title="Show note"></label><span class="sidenote" role="note">{{ body | markdown(inline=true) | safe }}</span>
