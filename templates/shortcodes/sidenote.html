<span class="sn-anchor-wrap inline-block"><button type="button" onclick="focusSidenote('note-{{ id }}')" class="note-pill inline-flex items-center justify-center font-mono text-xs px-1.5 py-0.2 mx-0.5 rounded bg-amber-500/10 text-accent-terra dark:text-amber-400 hover:bg-accent-terra hover:text-white transition cursor-pointer font-semibold" title="Jump to note"><span class="note-num"></span></button><span class="sidenote-data hidden" data-id="{{ id }}">{{ body | markdown(inline=true) }}</span></span><span class="lg:hidden block p-3 my-2 rounded-lg bg-amber-50 dark:bg-amber-950/20 border-l-2 border-accent-terra text-xs text-zinc-600 dark:text-zinc-400 font-sans"><span class="font-mono font-medium text-accent-terra">Note:</span> {{ body | markdown(inline=true) }}</span>
