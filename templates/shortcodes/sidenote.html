<input type="checkbox" id="sn-{{ id }}" class="sn-toggle"><label for="sn-{{ id }}" class="sn-ref" title="Show note"></label><span class="sidenote">{{ body | markdown(inline=true) | safe }}</span>{#- Numbered margin note toggled in place by a checkbox, no JS. Kept on one line: surrounding whitespace would leak into the prose. -#}
